[package]
name = "equity-matching-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic synthetic equity limit-order matching engine"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "=0.4.1"
core_affinity = "=0.8.3"
ibapi = { version = "=5.7.0", default-features = false, features = ["sync"] }

[lib]
name = "equity_matching_engine"
path = "src/lib.rs"

[[bin]]
name = "equity-matching-engine"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
